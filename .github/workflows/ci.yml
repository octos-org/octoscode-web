name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - run: node scripts/sync-core-contract.mjs --check
        env:
          GH_TOKEN: ${{ github.token }}

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The test growth ratchet reads who added its approval label.
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The base a pull request is compared with: the merge commit's parent.
          fetch-depth: 2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.5.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Validate reference nginx configuration
        run: |
          sudo apt-get update
          sudo apt-get install --yes nginx
          sudo nginx -t -c "$PWD/deploy/nginx.conf" -p /etc/nginx
      # A change may not add test lines on net (see the script's header). It
      # runs even when an earlier step failed, so both verdicts are in one log.
      - name: Test growth ratchet
        if: ${{ !cancelled() }}
        run: node scripts/test-growth.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Playwright runs the suite with a single worker on purpose (the specs
    # share one stateful fixture process), so the way to keep it inside the
    # cap is more jobs, not more workers: each shard gets its own fixture.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.5.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run all browser regressions
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.5.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Cache the browser binaries; the key carries the resolved Playwright
      # version so a bump invalidates the entry. On a hit, only the system
      # deps are re-installed (~10 s instead of a full download).
      - name: Resolve Playwright version
        id: playwright
        run:
          echo "version=$(pnpm exec playwright --version | awk '{print $3}')" >>
          "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key:
            playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install system dependencies for the browsers
        run: pnpm exec playwright install-deps firefox webkit
      - name: Install Firefox and WebKit (retry on a single stuck download)
        timeout-minutes: 3
        run: pnpm exec playwright install firefox webkit
      # Second and final attempt: on a cache hit the first step is ~free, so a
      # genuine outage still fails the job in a few minutes instead of the
      # whole 10-minute window — and the log names the failing step.
      - name: Retry browser install
        if: failure()
        timeout-minutes: 3
        run: pnpm exec playwright install firefox webkit
      - run: pnpm test:e2e:cross-browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: cross-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  core-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Download and verify pinned Core
        run: node scripts/fetch-pinned-core.mjs "$RUNNER_TEMP/octos-core"
      - name: Exercise real octos serve
        run: node scripts/verify-core-integration.mjs
        env:
          OCTOS_BINARY: ${{ runner.temp }}/octos-core/octos
