name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_visual_snapshots:
        description: "Regenerate e2e visual baselines in the CI environment"
        type: boolean
        default: false
      visual_spec_filter:
        description: "Which visual spec to update"
        default: e2e/visual.spec.ts

permissions:
  contents: read

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - run: node scripts/sync-core-contract.mjs --check
        env:
          GH_TOKEN: ${{ github.token }}

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.5.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Validate reference nginx configuration
        run: |
          sudo apt-get update
          sudo apt-get install --yes nginx
          sudo nginx -t -c "$PWD/deploy/nginx.conf" -p /etc/nginx

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The suite outgrew one 15-minute job. Playwright runs it with a single
    # worker on purpose (the specs share one stateful fixture process), so the
    # way to keep it inside the cap is more jobs, not more workers: each shard
    # gets its own fixture. Baseline regeneration stays on shard 1, which is
    # where e2e/visual.spec.ts lands.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.5.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Baseline regeneration: dispatch with update_visual_snapshots=true,
      # then download the visual-baselines artifact and commit it (keeps
      # baselines rendered by the same engine and fonts as CI).
      - name: Run all browser regressions
        if: inputs.update_visual_snapshots != true
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4
      - name: Regenerate visual baselines
        if: inputs.update_visual_snapshots == true && matrix.shard == 1
        run: pnpm test:e2e e2e/visual.spec.ts --update-snapshots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure() || inputs.update_visual_snapshots == true
        with:
          name: visual-baselines-shard-${{ matrix.shard }}
          path: e2e/visual.spec.ts-snapshots/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.5.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps firefox webkit
      - run: pnpm test:e2e:cross-browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: cross-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  core-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Download and verify pinned Core
        run: node scripts/fetch-pinned-core.mjs "$RUNNER_TEMP/octos-core"
      - name: Exercise real octos serve
        run: node scripts/verify-core-integration.mjs
        env:
          OCTOS_BINARY: ${{ runner.temp }}/octos-core/octos
