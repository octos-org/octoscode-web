name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify checked-out tag commit
        id: source
        run: |
          set -euo pipefail
          source_commit=$(git rev-parse HEAD)
          event_commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          if [[ "$source_commit" != "$event_commit" ]]; then
            echo "Release checkout $source_commit does not match tag event $event_commit" >&2
            exit 1
          fi
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.5.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG:?}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a SemVer-like tag such as v0.1.0 or v0.1.0-rc.1" >&2
            exit 1
          fi
          expected_version="${RELEASE_TAG#v}"
          for manifest in apps/web/package.json packages/client/package.json; do
            package_version=$(node -p "require('./$manifest').version")
            if [[ "$package_version" != "$expected_version" ]]; then
              echo "$manifest version $package_version does not match $RELEASE_TAG" >&2
              exit 1
            fi
          done
      - run: node scripts/sync-core-contract.mjs --check
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - run: pnpm test:e2e:cross-browser
      - name: Download and verify pinned Core
        run: node scripts/fetch-pinned-core.mjs "$RUNNER_TEMP/octos-core"
      - name: Exercise real octos serve
        run: node scripts/verify-core-integration.mjs
        env:
          OCTOS_BINARY: ${{ runner.temp }}/octos-core/octos
      - name: Build versioned distribution
        env:
          OCTOSCODE_WEB_RELEASE: ${{ github.ref_name }}
          OCTOSCODE_WEB_REVISION: ${{ steps.source.outputs.commit }}
        run: pnpm build
      - name: Package distribution
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          artifact="octoscode-web-${RELEASE_TAG:?}.tar.gz"
          stage="release-stage-${RELEASE_TAG}"
          test ! -e "$stage"
          mkdir "$stage"
          cp -R apps/web/dist/. "$stage/"
          cp LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md CHANGELOG.md SECURITY.md "$stage/"
          cp docs/deployment.md "$stage/DEPLOYMENT.md"
          cp -R deploy "$stage/deploy"
          tar -C "$stage" -czf "$artifact" .
          sha256sum "$artifact" > "$artifact.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-bundle
          path: |
            octoscode-web-${{ github.ref_name }}.tar.gz
            octoscode-web-${{ github.ref_name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
      - name: Verify tag still targets the packaged commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ needs.verify-and-package.outputs.source_commit }}
        run: |
          set -euo pipefail
          current_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          if [[ "$current_commit" != "$SOURCE_COMMIT" ]]; then
            echo "Release tag $RELEASE_TAG moved from $SOURCE_COMMIT to $current_commit" >&2
            exit 1
          fi
      - name: Refuse an existing release identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG:?}" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to attest or replace its assets" >&2
            exit 1
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            octoscode-web-${{ github.ref_name }}.tar.gz
            octoscode-web-${{ github.ref_name }}.tar.gz.sha256
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          artifact="octoscode-web-${RELEASE_TAG:?}.tar.gz"
          if gh release view "$RELEASE_TAG" --repo octos-org/octoscode-web >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace its assets" >&2
            exit 1
          fi
          release_args=(--verify-tag --generate-notes --draft --title "octoscode-web $RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "$artifact" "$artifact.sha256" "${release_args[@]}" --repo octos-org/octoscode-web
          gh release edit "$RELEASE_TAG" --draft=false --repo octos-org/octoscode-web
