name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.5.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG:?}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a SemVer-like tag such as v0.1.0 or v0.1.0-rc.1" >&2
            exit 1
          fi
      - run: node scripts/sync-core-contract.mjs --check
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Download and verify pinned Core
        run: node scripts/fetch-pinned-core.mjs "$RUNNER_TEMP/octos-core"
      - name: Exercise real octos serve
        run: node scripts/verify-core-integration.mjs
        env:
          OCTOS_BINARY: ${{ runner.temp }}/octos-core/octos
      - name: Build versioned distribution
        env:
          OCTOSCODE_WEB_RELEASE: ${{ github.ref_name }}
          OCTOSCODE_WEB_REVISION: ${{ github.sha }}
        run: pnpm build
      - name: Package distribution
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          artifact="octoscode-web-${RELEASE_TAG:?}.tar.gz"
          stage="release-stage-${RELEASE_TAG}"
          test ! -e "$stage"
          mkdir "$stage"
          cp -R apps/web/dist/. "$stage/"
          cp LICENSE THIRD_PARTY_NOTICES.md CHANGELOG.md SECURITY.md "$stage/"
          cp docs/deployment.md "$stage/DEPLOYMENT.md"
          cp -R deploy "$stage/deploy"
          tar -C "$stage" -czf "$artifact" .
          sha256sum "$artifact" > "$artifact.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-bundle
          path: |
            octoscode-web-${{ github.ref_name }}.tar.gz
            octoscode-web-${{ github.ref_name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-bundle
      - name: Refuse an existing release identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG:?}" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to attest or replace its assets" >&2
            exit 1
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            octoscode-web-${{ github.ref_name }}.tar.gz
            octoscode-web-${{ github.ref_name }}.tar.gz.sha256
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          artifact="octoscode-web-${RELEASE_TAG:?}.tar.gz"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace its assets" >&2
            exit 1
          fi
          release_args=(--verify-tag --generate-notes --draft --title "octoscode-web $RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "$artifact" "$artifact.sha256" "${release_args[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
