name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG:?}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a SemVer-like tag such as v0.1.0 or v0.1.0-rc.1" >&2
            exit 1
          fi
      - run: node scripts/sync-core-contract.mjs --check
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Resolve pinned Core release
        id: core
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const contract = require("./packages/client/core-runtime.json");
          const asset = contract.assets["linux-x64"];
          console.log(`name=${asset.name}`);
          console.log(`sha256=${asset.sha256}`);
          console.log(`url=${contract.repository}/releases/download/${contract.tag}/${asset.name}`);
          NODE
      - name: Download and verify pinned Core
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/octos-core"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/octos-core/${{ steps.core.outputs.name }}" \
            "${{ steps.core.outputs.url }}"
          echo "${{ steps.core.outputs.sha256 }}  $RUNNER_TEMP/octos-core/${{ steps.core.outputs.name }}" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/octos-core/${{ steps.core.outputs.name }}" \
            -C "$RUNNER_TEMP/octos-core"
      - name: Exercise real octos serve
        run: node scripts/verify-core-integration.mjs
        env:
          OCTOS_BINARY: ${{ runner.temp }}/octos-core/octos
      - name: Build versioned distribution
        env:
          OCTOSCODE_WEB_RELEASE: ${{ github.ref_name }}
          OCTOSCODE_WEB_REVISION: ${{ github.sha }}
        run: pnpm build
      - name: Package distribution
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          artifact="octoscode-web-${RELEASE_TAG:?}.tar.gz"
          stage="release-stage-${RELEASE_TAG}"
          test ! -e "$stage"
          mkdir "$stage"
          cp -R apps/web/dist/. "$stage/"
          cp LICENSE THIRD_PARTY_NOTICES.md "$stage/"
          cp docs/deployment.md "$stage/DEPLOYMENT.md"
          cp -R deploy "$stage/deploy"
          tar -C "$stage" -czf "$artifact" .
          sha256sum "$artifact" > "$artifact.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          artifact="octoscode-web-${RELEASE_TAG:?}.tar.gz"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$artifact" "$artifact.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "$artifact" "$artifact.sha256" \
              --verify-tag \
              --generate-notes \
              --title "octoscode-web $RELEASE_TAG"
          fi
