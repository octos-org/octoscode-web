version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # #234: katex is pinned exactly and moves only as a coordinated
    # double-upgrade with rehype-katex in one reviewed commit — either half
    # alone trips the single-version policy gate, so Dependabot leaves the
    # pair alone until that lands deliberately.
    ignore:
      - dependency-name: "katex"
      - dependency-name: "rehype-katex"
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
