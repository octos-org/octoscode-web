worker_processes auto;
error_log stderr warn;

events {
  worker_connections 1024;
}

http {
  # Keep the reference configuration self-contained. Relative `mime.types`
  # includes resolve beside this file when `nginx -c` receives an absolute
  # path, which made validation and non-default installations environment-
  # dependent.
  types {
    text/html html htm;
    text/css css;
    application/javascript js mjs;
    application/json json;
    application/manifest+json webmanifest;
    application/wasm wasm;
    image/svg+xml svg;
    image/png png;
    image/jpeg jpg jpeg;
    image/gif gif;
    image/webp webp;
    image/x-icon ico;
    font/woff woff;
    font/woff2 woff2;
  }
  default_type application/octet-stream;
  server_tokens off;
  client_max_body_size 1m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Deliberately omit the query string: the current AppUI WebSocket query may
  # carry an auth token. Do not replace $uri with $request or $request_uri.
  log_format octoscode_privacy '$remote_addr [$time_local] "$request_method $uri" '
                               '$status $body_bytes_sent $request_time';
  access_log /var/log/nginx/access.log octoscode_privacy;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream octos_appui {
    server 127.0.0.1:50080;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;
    root /srv/octoscode-web;
    index index.html;

    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; manifest-src 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Enable only when this host is HTTPS-only at the public edge.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /index.html {
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    location = /octoscode-web-build.json {
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    # Branding resources are intentionally stable root filenames. Revalidate
    # them so a deployment can replace the product mark without leaving an
    # older favicon or launcher icon in intermediary caches.
    location ~ ^/(?:favicon\.svg|favicon-(?:16|32)\.png|apple-touch-icon\.png|octopus-mark\.svg|octos-icon-(?:192|512)\.png|site\.webmanifest)$ {
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    location ~ ^/(?:LICENSE|THIRD_PARTY_NOTICES\.md|THIRD_PARTY_LICENSES\.md|DEPLOYMENT\.md)$ {
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Same-origin AppUI proxy. Configure octos serve with
    # OCTOS_APPUI_ALLOWED_ORIGINS=https://code.example.com (the public origin).
    location /api/ {
      proxy_pass http://octos_appui;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }

    location = /health {
      proxy_pass http://octos_appui;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
